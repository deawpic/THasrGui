[project]
name = "typhoon-transcriber"
version = "2.0.1"
description = "Typhoon ASR Cross-Platform Desktop Transcriber (Thai Real-Time Offline Speech-to-Text)"
readme = "README.md"
authors = [
    { name = "Taniya Supasin", email = "deawpic@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.6",
    "pydub>=0.25.1",
    "pyside6>=6.11.2",
    "sentencepiece>=0.2.2",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "onnxruntime-gpu==1.22.0 ; sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12>=12.9.0 ; sys_platform == 'linux'",
    "nvidia-cublas-cu12>=12.9.0 ; sys_platform == 'linux'",
    "nvidia-cudnn-cu12==9.10.2.21 ; sys_platform == 'linux'",
    "nvidia-curand-cu12>=10.3.0 ; sys_platform == 'linux'",
    "nvidia-cufft-cu12>=11.4.0 ; sys_platform == 'linux'",
    "onnxruntime-directml>=1.20.0 ; sys_platform == 'win32'",
]

[project.scripts]
typhoon-transcriber = "typhoon_transcriber:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["typhoon_transcriber*"]


[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]
