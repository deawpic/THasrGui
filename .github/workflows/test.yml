name: Test Suite & Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Pytest & Integrity Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies for PySide6 & Audio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libportaudio2

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Determine Application Directory
        id: app_info
        shell: bash
        run: |
          if [ -f "src/pyproject.toml" ]; then
              echo "app_dir=src" >> "$GITHUB_OUTPUT"
          else
              echo "app_dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies via uv
        run: uv sync --directory "${{ steps.app_info.outputs.app_dir }}" --dev

      - name: Verify Python Syntax Compilation
        run: uv run --directory "${{ steps.app_info.outputs.app_dir }}" python -m py_compile typhoon_transcriber/main.py

      - name: Run Pytest Suite
        run: uv run --directory "${{ steps.app_info.outputs.app_dir }}" pytest tests/ -v
