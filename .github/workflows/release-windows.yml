name: Release Windows Standalone (PyInstaller onedir)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build TyphoonTranscriber (Windows x64 PyInstaller onedir)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Determine Application Directory
        id: app_info
        shell: pwsh
        run: |
          if (Test-Path "src/pyproject.toml") {
              Write-Host "Detected application in src/ directory"
              "app_dir=src" >> $env:GITHUB_OUTPUT
              "spec_file=src/typhoon_transcriber.spec" >> $env:GITHUB_OUTPUT
          } else {
              Write-Host "Detected application in repository root"
              "app_dir=." >> $env:GITHUB_OUTPUT
              "spec_file=typhoon_transcriber.spec" >> $env:GITHUB_OUTPUT
          }

      - name: Install Dependencies via uv
        shell: pwsh
        run: |
          $appDir = "${{ steps.app_info.outputs.app_dir }}"
          Write-Host "Installing dependencies in $appDir..."
          uv sync --directory $appDir --dev

      - name: Run Test Suite Verification
        shell: pwsh
        run: |
          $appDir = "${{ steps.app_info.outputs.app_dir }}"
          Write-Host "Running pytest verification before compiling in $appDir..."
          uv run --directory $appDir pytest tests/ -v

      - name: Build Standalone onedir with PyInstaller
        shell: pwsh
        run: |
          $appDir = "${{ steps.app_info.outputs.app_dir }}"
          $specFile = "${{ steps.app_info.outputs.spec_file }}"
          Write-Host "Packaging standalone onedir application with PyInstaller ($specFile)..."
          uv run --directory $appDir pyinstaller $specFile --clean --noconfirm

          if ($LASTEXITCODE -ne 0) {
              Write-Error "CRITICAL: PyInstaller build failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: Prepare Release Package & ZIP Bundle
        shell: pwsh
        run: |
          $appDir = "${{ steps.app_info.outputs.app_dir }}"
          $distDir = Join-Path $appDir "dist"
          $onedirFolder = Join-Path $distDir "TyphoonTranscriber"

          if (-not (Test-Path $onedirFolder)) {
              Write-Error "CRITICAL: PyInstaller onedir folder '$onedirFolder' was not created!"
              exit 1
          }

          $exePath = Join-Path $onedirFolder "TyphoonTranscriber.exe"
          if (-not (Test-Path $exePath)) {
              Write-Error "CRITICAL: TyphoonTranscriber.exe was not found inside '$onedirFolder'!"
              exit 1
          }

          Write-Host "SUCCESS: Found PyInstaller onedir folder at: $onedirFolder"
          Write-Host "SUCCESS: Found executable at: $exePath"

          $releaseDir = "TyphoonTranscriber-Windows-x64"
          if (Test-Path $releaseDir) {
              Remove-Item -Recurse -Force $releaseDir
          }

          # Copy entire standalone onedir directory directly to preserve _internal/ and directory tree
          Copy-Item -Path $onedirFolder -Destination $releaseDir -Recurse -Force

          # Verify critical _internal directory is preserved
          $internalDir = Join-Path $releaseDir "_internal"
          if (-not (Test-Path $internalDir)) {
              Write-Error "CRITICAL: '_internal' directory was not found in $releaseDir!"
              exit 1
          }

          # Verify python runtime DLL is inside _internal
          $pythonDll = Get-ChildItem -Path $internalDir -Filter "python*.dll" | Select-Object -First 1
          if ($null -eq $pythonDll) {
              Write-Error "CRITICAL: python*.dll was not found inside '$internalDir'!"
              exit 1
          }
          Write-Host "SUCCESS: Verified python DLL at: $($pythonDll.FullName)"

          # Include documentation if available
          if (Test-Path "$appDir/README.md") {
              Copy-Item "$appDir/README.md" -Destination $releaseDir
          } elseif (Test-Path "README.md") {
              Copy-Item "README.md" -Destination $releaseDir
          }

          # Create models folder with offline guide
          $modelsDir = Join-Path $releaseDir "models"
          New-Item -ItemType Directory -Force -Path $modelsDir | Out-Null
          $modelInfo = @"
          Typhoon ASR Offline Models Directory
          ====================================
          For 100% offline portable usage, place the official model files here:
          1. encoder-fastconformer-quran-ar.onnx
          2. decoder_joint-fastconformer-quran-ar.onnx
          3. vocab.json

          Download links: https://huggingface.co/wannaphong/typhoon-asr-realtime-onnx
          Note: If launched with internet access, TyphoonTranscriber can automatically download them for you.
          "@
          $modelInfo | Out-File -Encoding utf8 (Join-Path $modelsDir "README_MODELS.txt")

          # Create compressed distribution archive
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "TyphoonTranscriber-Windows-x64.zip" -Force
          Write-Host "Generated TyphoonTranscriber-Windows-x64.zip successfully."

      - name: Upload Standalone Distribution ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TyphoonTranscriber-Windows-x64-Zip
          path: TyphoonTranscriber-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release (on Tag Push or Release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tagName = "${{ github.ref_name }}"
          if ($null -eq $tagName -or $tagName -eq "") {
              $tagName = "${{ github.event.release.tag_name }}"
          }
          $zipPath = "TyphoonTranscriber-Windows-x64.zip"

          Write-Host "Publishing GitHub Release for $tagName ($zipPath) via gh CLI..."
          gh release upload $tagName $zipPath --clobber 2>$null
          if ($LASTEXITCODE -ne 0) {
              gh release create $tagName $zipPath --title "$tagName - Windows x64 Standalone (PyInstaller onedir)" --generate-notes
          }
